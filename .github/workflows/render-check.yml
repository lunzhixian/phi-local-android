name: Render Check

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'web/**'
      - 'tools/**'
      - '.github/workflows/render-check.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i --no-audit --no-fund puppeteer@23 art-template@4.13.4 pixelmatch@5 pngjs@6

      - name: Render reference (official template) vs app template
        run: node tools/render-check.mjs
        continue-on-error: true

      - name: Upload rendered cards
        uses: actions/upload-artifact@v4
        with:
          name: render-output
          path: render-out/
          if-no-files-found: error

      - name: Publish preview to release (public URL)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete render-preview --yes --cleanup-tag -R ${{ github.repository }} || true
          gh release create render-preview render-out/b30-reference.png render-out/b30-app.png render-out/diff-app-vs-ref.png render-out/report.json \
            -R ${{ github.repository }} -t "渲染校验输出" -n "官方模板参考图 / App 内模板图 / 差异图 / 报告" --prerelease || true

      - name: Fail if pixel mismatch
        continue-on-error: true
        run: |
          node -e "const r=require('./render-out/report.json');console.log(JSON.stringify(r));process.exit(r.identical?0:2)"
