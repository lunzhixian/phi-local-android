name: Render Check

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'web/**'
      - 'tools/**'
      - '.github/workflows/render-check.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i --no-audit --no-fund puppeteer@23 art-template@4.13.4 pixelmatch@5 pngjs@6

      - name: Render reference (official template) vs app template
        run: node tools/render-check.mjs
        continue-on-error: true

      - name: Upload rendered cards
        uses: actions/upload-artifact@v4
        with:
          name: render-output
          path: render-out/
          if-no-files-found: error

      - name: Fail if pixel mismatch
        run: |
          node -e "const r=require('./render-out/report.json');console.log(JSON.stringify(r));process.exit(r.identical?0:2)"
