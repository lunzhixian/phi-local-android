<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>render</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #boot { color: #666; font: 14px sans-serif; padding: 8px; }
</style>
</head>
<body>
<div id="boot">rendering…</div>
<script src="b19-tpl.js"></script>
<script>
  window.__render = function (json) {
    try {
      var data = JSON.parse(json);
      var html = window.__B19_TPL(data);
      // 固定 1200 CSS px 版心，交给 WebView 的 overview 模式自动铺满屏宽
      html = html.replace(/<meta\s+name=["']viewport["'][^>]*>/i,
        '<meta name="viewport" content="width=1200, user-scalable=no">');
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      if (window.CaptureBridge) window.CaptureBridge.fail(String((e && e.message) || e));
      return;
    }
    // 任何图片加载失败都隐藏，避免破图
    document.addEventListener('error', function (e) {
      var t = e.target;
      if (t && t.tagName === 'IMG') { t.style.visibility = 'hidden'; }
    }, true);
    finish();
  };

  window.__measure = function () {
    var b = document.body.getBoundingClientRect();
    return JSON.stringify({
      iw: window.innerWidth, ih: window.innerHeight, dpr: window.devicePixelRatio,
      w: Math.ceil(Math.max(b.width, document.body.scrollWidth, 1200)),
      h: Math.ceil(Math.max(b.height, document.body.scrollHeight))
    });
  };

  function finish() {
    var imgs = Array.prototype.slice.call(document.images);
    var waits = imgs.map(function (im) {
      return im.complete ? Promise.resolve() : new Promise(function (r) { im.onload = im.onerror = r; });
    });
    var fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    var all = Promise.all([fonts].concat(waits));
    var cap = new Promise(function (r) { setTimeout(r, 6000); });
    Promise.race([all, cap]).then(function () {
      setTimeout(function () {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            var bodyRect = document.body.getBoundingClientRect();
            var w = Math.ceil(Math.max(bodyRect.width, document.body.scrollWidth, 1200));
            var h = Math.ceil(Math.max(bodyRect.height, document.body.scrollHeight));
            var info = JSON.stringify({
              iw: window.innerWidth, ih: window.innerHeight,
              dpr: window.devicePixelRatio,
              sw: document.body.scrollWidth, sh: document.body.scrollHeight,
              bw: Math.round(bodyRect.width), bh: Math.round(bodyRect.height)
            });
            if (window.CaptureBridge) window.CaptureBridge.readyInfo(w, h, info);
          });
        });
      }, 150);
    });
  }
</script>
</body>
</html>
